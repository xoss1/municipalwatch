[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "municipalwatch"
version = "0.1.0"
description = "Monitorización automatizada y alertas de edictos municipales mediante filtrado por palabras clave."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Tu Nombre", email = "tuemail@ejemplo.com" }
]
keywords = ["scraping", "edictos", "ayuntamientos", "alerts", "automation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "streamlit>=1.20.0",
    "curl-cffi>=0.7.0",
    "supabase"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
]

[project.scripts]
municipalwatch = "municipalwatch.main:monitorizar_todos"
